name: Trigger auto deployment for ca-sb-attendance

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-sb-attendance-AutoDeployTrigger-c6d73368-af2e-44af-a6ec-8adea1873674.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.CASBATTENDANCE_AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.CASBATTENDANCE_AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.CASBATTENDANCE_AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.CASBATTENDANCE_AZURE_SUBSCRIPTION_ID }}"}'


      - name: Log in to Azure Container Registry
        run: |
          az acr login --name crspringbrookjeffpriz

      - name: Build and push container image to registry
        run: |
          docker build --file ./Dockerfile --tag crspringbrookjeffpriz.azurecr.io/ca-sb-attendance:${GITHUB_SHA} .
          docker push crspringbrookjeffpriz.azurecr.io/ca-sb-attendance:${GITHUB_SHA}


