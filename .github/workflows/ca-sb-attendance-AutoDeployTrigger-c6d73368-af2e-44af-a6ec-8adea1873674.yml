name: Trigger auto deployment for ca-sb-attendance

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-sb-attendance-AutoDeployTrigger-c6d73368-af2e-44af-a6ec-8adea1873674.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.CASBATTENDANCE_AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.CASBATTENDANCE_AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.CASBATTENDANCE_AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.CASBATTENDANCE_AZURE_SUBSCRIPTION_ID }}"}'


      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: crspringbrookjeffpriz.azurecr.io
          containerAppName: ca-sb-attendance
          resourceGroup: rg-sb-disciple
          imageToBuild: ca-sb-attendance:${{ github.sha }}
          dockerfilePath: ./Dockerfile


